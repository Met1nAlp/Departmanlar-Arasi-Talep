appId: com.anonymous.talepuygulamasi
---
# Plan Bölüm 12.4 offline-first akışı: saha personeli "+" ile yeni talep
# başlatır, departman seçer, ürün ekranına ulaşır. Kamera okuma Maestro'da
# simüle edilemediğinden bu akış QRScan ekranına ulaşmayı doğrular
# (asıl createRequest -> outbox akışı Jest tarafında birim test edildi,
# bkz. src/infrastructure/sync/__tests__/outboxScheduler.test.ts).
- runFlow: login-and-pin-session.yaml
- tapOn:
    id: "home-new-request-fab"
- assertVisible: "Hangi departmandan talep edeceksiniz?"
- tapOn: "Depo"
- assertVisible:
    text: "QR"
    optional: true
