appId: com.anonymous.talepuygulamasi
---
# Plan Bölüm 12.4 offline-first akışı: saha personeli "+" ile yeni talep
# başlatır (öncelik seçimi -> departman seçimi -> QR tarama). Kamera okuma
# Maestro'da simüle edilemediğinden bu akış QR tarama ekranına (ScanTarget)
# ulaşmayı doğrular; createRequest/outbox mantığı Jest tarafında birim test
# edildi (bkz. src/infrastructure/sync/__tests__/outboxScheduler.test.ts).
- runFlow: login-and-pin-session.yaml
- tapOn:
    id: "home-new-request-fab"
- assertVisible: "Bu talebin önceliği nedir?"
- tapOn: "Devam Et"
- assertVisible: "Hangi departmandan talep edeceksiniz?"
- tapOn: "Depo"
- assertVisible: "Ürünün kodunu kadraja alın"
